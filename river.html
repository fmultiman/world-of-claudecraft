<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050509" />
<meta name="robots" content="noindex, nofollow" />
<title>O Rio (vertical slice em preparacao)</title>
<style>
  /* Minimal page shell; the game CSS layers arrive via src/river_main.ts
     (import './styles/index.css', the same single import src/main.ts uses). */
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050509; }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #nameplates { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #river-boot {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(120% 120% at 50% 20%, #0b1420 0%, #050509 70%);
    color: #e8e6df;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #river-boot .kicker { font-size: 0.72rem; letter-spacing: 0.28em; text-transform: uppercase; opacity: 0.5; margin: 0 0 1rem; }
  #river-boot .title { font-size: 2.75rem; letter-spacing: 0.03em; margin: 0 0 1.25rem; font-weight: 600; }
  #river-boot .status { font-size: 0.85rem; opacity: 0.6; margin: 0; }
  /* The slice's one-line message surface: quiet, bottom-center, fades in and
     out via .show. Not a system toast; reused by later steps. */
  #river-message {
    position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%);
    z-index: 5; max-width: min(80vw, 34rem); text-align: center;
    color: #dceeec; font-family: Georgia, "Times New Roman", serif;
    font-size: 1.35rem; font-style: italic; letter-spacing: 0.02em;
    text-shadow: 0 1px 8px rgba(5, 10, 14, 0.85);
    opacity: 0; transition: opacity 1.4s ease-in-out; pointer-events: none;
  }
  #river-message.show { opacity: 1; }
  /* One ambient breath of the water's presence: a soft cool tint that eases in
     and back out. Never blocks input; nothing that reads as damage. */
  #river-veil {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 62%,
      rgba(70, 140, 150, 0.34) 0%, rgba(40, 90, 110, 0.20) 45%, rgba(10, 30, 40, 0.05) 80%);
    opacity: 0; transition: opacity 2.2s ease-in-out;
  }
  #river-veil.show { opacity: 1; }
  /* Small contextual interaction cue, shown only at the offering stone while
     carrying the token. Separate from the narrative message; not a HUD. */
  #river-hint {
    position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
    z-index: 5; pointer-events: none;
    padding: 0.35rem 0.9rem; border-radius: 999px;
    background: rgba(10, 20, 24, 0.55); border: 1px solid rgba(180, 220, 216, 0.35);
    color: #e6f2f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 0.9rem; letter-spacing: 0.04em;
    opacity: 0; transition: opacity 0.4s ease-in-out;
  }
  #river-hint.show { opacity: 1; }
  /* E9 touch controls: slice-only, hidden by default and revealed only when
     src/river_main.ts adds body.river-touch (coarse pointer / touch device). The
     container passes touches through (pointer-events: none) so the canvas still
     receives the camera drag everywhere except over the joystick and button. */
  #river-touch-controls { position: fixed; inset: 0; z-index: 6; pointer-events: none; display: none; }
  body.river-touch #river-touch-controls { display: block; }
  body.river-touch { -webkit-user-select: none; user-select: none; }
  /* Prevent browser scroll/zoom gestures on the game surface during a camera drag. */
  body.river-touch #game-canvas { touch-action: none; }
  #river-joystick {
    position: absolute;
    left: calc(env(safe-area-inset-left, 0px) + 4.5vw);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh);
    width: 132px; height: 132px; border-radius: 50%;
    background: rgba(10, 20, 24, 0.28);
    border: 1px solid rgba(180, 220, 216, 0.30);
    pointer-events: auto; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #river-joystick-knob {
    position: absolute; left: 50%; top: 50%;
    width: 58px; height: 58px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: rgba(200, 230, 226, 0.55);
    border: 1px solid rgba(230, 245, 242, 0.7);
    pointer-events: none;
  }
  #river-interact {
    position: absolute;
    right: calc(env(safe-area-inset-right, 0px) + 5vw);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh);
    min-width: 6.2rem; padding: 0.9rem 1.35rem; border-radius: 999px;
    background: rgba(10, 20, 24, 0.45);
    border: 1px solid rgba(180, 220, 216, 0.35);
    color: #e6f2f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.05rem; letter-spacing: 0.04em;
    pointer-events: auto; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    opacity: 0.42; transition: opacity 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  /* Highlighted only when an offer is valid; dim but reachable otherwise, so it
     never reveals where to interact. */
  #river-interact.valid {
    opacity: 1;
    background: rgba(30, 70, 66, 0.72);
    box-shadow: 0 0 16px rgba(150, 220, 210, 0.45);
  }
  #river-interact:active { transform: scale(0.96); }
  /* Portrait is tolerated: lift the controls clear of the bottom-center message. */
  @media (orientation: portrait) {
    #river-joystick { bottom: calc(env(safe-area-inset-bottom, 0px) + 12vh); }
    #river-interact { bottom: calc(env(safe-area-inset-bottom, 0px) + 12vh); }
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="nameplates"></div>
<div id="river-veil"></div>
<div id="river-message" aria-live="polite"></div>
<div id="river-hint" aria-live="polite"></div>
<div id="river-touch-controls">
  <div id="river-joystick" aria-hidden="true"><div id="river-joystick-knob"></div></div>
  <button id="river-interact" type="button">Interagir</button>
</div>
<div id="river-boot">
  <div>
    <p class="kicker">Jogo Xamanico</p>
    <h1 class="title">O Rio</h1>
    <p class="status" id="river-status">Preparando a travessia...</p>
  </div>
</div>
<script type="module" src="/src/river_main.ts"></script>
</body>
</html>
